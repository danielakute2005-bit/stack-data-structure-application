<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stack Data Structure - Undo Simulator</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:20px;color:#222}
.container{max-width:700px;margin:auto;background:white;padding:25px;border-radius:14px;box-shadow:0 4px 18px #0002}
h1{text-align:center}.controls{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;padding:12px;border:1px solid #bbb;border-radius:8px}
button{padding:11px 16px;border:0;border-radius:8px;cursor:pointer}
.stack{margin-top:20px;display:flex;flex-direction:column-reverse;gap:8px;min-height:80px}
.item{padding:14px;background:#e9eef5;border-radius:8px;text-align:center;border:1px solid #ccd5df}
.top{font-weight:bold}.info{text-align:center;color:#666}
</style>
</head>
<body>
<div class="container">
<h1>Stack / Undo Simulator</h1>
<p class="info">LIFO: Last In, First Out</p>
<div class="controls">
<input id="action" placeholder="Enter an action, e.g. Typed Hello">
<button onclick="pushItem()">Push</button>
<button onclick="popItem()">Pop (Undo)</button>
<button onclick="peekItem()">Peek</button>
<button onclick="clearStack()">Clear</button>
</div>
<p id="message" class="info"></p>
<div id="stack" class="stack"></div>
</div>
<script>
const stack=[];
function render(){
 const box=document.getElementById("stack");
 box.innerHTML="";
 [...stack].reverse().forEach((x,i)=>{
   const d=document.createElement("div");
   d.className="item"+(i===0?" top":"");
   d.textContent=(i===0?"TOP → ":"")+x;
   box.appendChild(d);
 });
}
function pushItem(){
 const input=document.getElementById("action"), v=input.value.trim();
 if(!v){document.getElementById("message").textContent="Enter an action first.";return;}
 stack.push(v); input.value="";
 document.getElementById("message").textContent="Action pushed onto the stack.";
 render();
}
function popItem(){
 if(!stack.length){document.getElementById("message").textContent="Stack is empty.";return;}
 const x=stack.pop();
 document.getElementById("message").textContent="Undo: removed \""+x+"\".";
 render();
}
function peekItem(){
 document.getElementById("message").textContent=stack.length?"Top item: "+stack[stack.length-1]:"Stack is empty.";
}
function clearStack(){stack.length=0;document.getElementById("message").textContent="Stack cleared.";render();}
render();
</script>
</body>
</html>
